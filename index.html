    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        { "@type": "Organization", "@id": "https://tack-issues.vercel.app/#org", "name": "Tack", "url": "https://tack-issues.vercel.app/", "logo": "https://tack-issues.vercel.app/icon-512.png" },
        { "@type": "WebSite", "@id": "https://tack-issues.vercel.app/#website", "url": "https://tack-issues.vercel.app/", "name": "Tack", "publisher": { "@id": "https://tack-issues.vercel.app/#org" } },
        { "@type": "SoftwareApplication", "name": "Tack", "applicationCategory": "BusinessApplication", "operatingSystem": "Web",
          "offers": { "@type": "Offer", "price": "5", "priceCurrency": "USD", "description": "Per person, per month" } }
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking the first paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>
    <link rel="preload" as="image" href="/illustrations/macbook.svg" />
    <style>
      /* First paint, before the app's code arrives: a skeleton of the page you asked for. React replaces it. */
      body { margin: 0; background: #fff; }
      .boot { font-family: Inter, system-ui, sans-serif; min-height: 100vh; }
      .boot i { display: block; border-radius: 4px; background: linear-gradient(90deg, #eeeef2 0%, #f6f6f9 45%, #eeeef2 90%); background-size: 200% 100%; animation: boot-shine 1.4s ease-in-out infinite; }
      @keyframes boot-shine { from { background-position: 100% 0 } to { background-position: -100% 0 } }
      @media (prefers-reduced-motion: reduce) { .boot i { animation: none } }
      .boot-nav { height: 64px; border-bottom: 1px solid #e2e3e9; display: flex; align-items: center; gap: 28px; padding: 0 max(16px, calc((100vw - 1232px) / 2 + 24px)); }
      .boot-nav svg { height: 26px; width: auto; }
      .boot-hero { max-width: 760px; margin: 96px auto 0; padding: 0 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .boot-shot { max-width: 1180px; margin: 56px auto 0; padding: 0 16px; }
      .boot-app { display: flex; min-height: 100vh; background: #f7f7f9; }
      .boot-side { width: 240px; background: #fff; border-right: 1px solid #e2e3e9; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
      .boot-main { flex: 1; min-width: 0; }
      .boot-top { height: 56px; background: #fff; border-bottom: 1px solid #e2e3e9; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
      .boot-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 20px 24px; }
      .boot-col { background: #eeeef2; border: 1px solid #e2e3e9; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
      .boot-card { background: #fff; border: 1px solid #e2e3e9; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
      @media (max-width: 767px) { .boot-side { display: none } .boot-cols { grid-template-columns: minmax(0, 1fr); } .boot-col:nth-child(n+2) { display: none } .boot-nav span { display: none } }
    </style>
  </head>
  <body>
    <div id="route-bar" class="route-bar" aria-hidden="true"><i></i></div>
    <div id="root"></div>
    <script>
      (function () {
        var logo = '<svg viewBox="0 0 64 24" fill="none" aria-label="Tack"><circle cx="10" cy="4.5" r="3.5" fill="#183FD9"/><g stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8.5V17c0 1.66 1.34 3 3 3h3.5"/><path d="M5.5 10.5H15"/><circle cx="26.5" cy="14.8" r="4.9"/><path d="M31.4 10v10"/><path d="M45.6 11.4a4.9 4.9 0 1 0 0 6.8"/><path d="M51.5 3.5V20"/><path d="M58.6 10.2 52.6 15.6"/><path d="M54.8 13.9 59 20"/></g></svg>';
        var b = function (w, h, extra) { return '<i style="width:' + w + ';height:' + h + 'px;' + (extra || '') + '"></i>' };
        var card = function () { return '<div class="boot-card">' + b('85%', 10) + b('55%', 10) + '<div style="display:flex;justify-content:space-between">' + b('40%', 12) + b('20px', 20, 'border-radius:50%') + '</div></div>' };
        var col = function (n) { var s = '<div class="boot-col">' + b('40%', 18, 'border-radius:999px'); for (var k = 0; k < n; k++) s += card(); return s + '</div>' };
        var html;
        if (location.pathname.indexOf('/app') === 0) {
          html = '<div class="boot boot-app"><div class="boot-side">' + logo.replace('<svg', '<svg style="height:22px;width:auto"') + '<div style="height:12px"></div>' + b('60%', 10) + b('90%', 26) + b('80%', 26) + b('70%', 26) +
            '</div><div class="boot-main"><div class="boot-top">' + b('180px', 12) + b('120px', 32) + '</div><div class="boot-cols">' + col(3) + col(2) + col(2) + col(3) + '</div></div></div>';
        } else {
          html = '<div class="boot"><div class="boot-nav">' + logo + '<span>' + b('260px', 10) + '</span></div><div class="boot-hero">' + b('180px', 22) + b('92%', 46) + b('70%', 46) + '<div style="height:6px"></div>' + b('60%', 14) + b('48%', 14) +
            '<div style="display:flex;gap:10px;margin-top:14px">' + b('130px', 44) + b('130px', 44) + '</div></div><div class="boot-shot">' + b('100%', 360, 'border-radius:14px 14px 0 0') + '</div></div>';
        }
        document.getElementById('root').innerHTML = html;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
